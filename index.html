<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N4 — Bunpou & Kotoba</title>
<style>
:root{
  --bg:#FAF7F1; --bg2:#F2ECDF; --card:#FFFFFF; --line:#E9E1CF;
  --text:#26242B; --text2:#71695A;
  --accent:#3E4FA8; --sakura:#D97A93;
  --accent-soft:#ECEDF9;
  --green:#4C8055; --green-soft:#E9F2E6;
  --orange:#C96A1F; --orange-soft:#FBEDDC;
  --red:#C94F47; --red-soft:#FAE9E7;
  --purple:#8A5FA8; --purple-soft:#F4EFF8;
  --rt:#5870CE;
  --grad:linear-gradient(135deg,#39468F 0%,#4B3D92 55%,#6C3F83 100%);
  --hero-grad:linear-gradient(125deg,#2E3A8C 0%,#4B3D92 52%,#7C3F74 100%);
  --shadow:0 1px 2px rgba(70,58,32,.05), 0 6px 20px rgba(70,58,32,.07);
  --shadow-lg:0 2px 4px rgba(70,58,32,.07), 0 16px 38px rgba(70,58,32,.13);
  --ring:0 0 0 3px rgba(62,79,168,.20);
  /* structural theme values (overridden in dark below) */
  --body-bg:
    radial-gradient(1100px 480px at 50% -200px, rgba(62,79,168,.08), transparent 62%),
    radial-gradient(rgba(62,79,168,.055) 1px, transparent 1.6px),
    var(--bg);
  --tab-on-bg:#FFFFFF;
  --tab-on-shadow:0 1px 4px rgba(60,48,20,.14);
  --switch-track-off:#DCD5C4;
  --switch-knob:#FFFFFF;
  --hero-btn-bg:rgba(255,255,255,.14);
  --stat-bg:rgba(255,255,255,.13);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141C; --bg2:#191C27; --card:#1F2331; --line:#31374B;
    --text:#ECEDF2; --text2:#9BA1B6;
    --accent:#96A6EE; --sakura:#E59AAF;
    --accent-soft:#2A3050;
    --green:#86C796; --green-soft:#223129;
    --orange:#E09A55; --orange-soft:#362818;
    --red:#E07B73; --red-soft:#3B2327;
    --purple:#BE93D8; --purple-soft:#2E2739;
    --rt:#A3B5F2;
    --grad:linear-gradient(135deg,#2A3560 0%,#3B2F63 55%,#522F66 100%);
    --hero-grad:linear-gradient(125deg,#232B66 0%,#3A2F6B 52%,#5C2F57 100%);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.42);
    --shadow-lg:0 2px 4px rgba(0,0,0,.42), 0 16px 38px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(150,166,238,.28);
    --body-bg:
      radial-gradient(1100px 480px at 50% -200px, rgba(150,166,238,.09), transparent 62%),
      radial-gradient(rgba(150,166,238,.05) 1px, transparent 1.6px),
      var(--bg);
    --tab-on-bg:#2B3145;
    --tab-on-shadow:0 1px 4px rgba(0,0,0,.5);
    --switch-track-off:#3C4358;
    --switch-knob:#E9EBF3;
    --hero-btn-bg:rgba(255,255,255,.10);
    --stat-bg:rgba(255,255,255,.10);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--body-bg);
  background-size:auto, 24px 24px, auto;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  line-height:1.6;
}
::selection{background:var(--accent-soft)}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 64px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--ring)}
.kj-card:focus-visible{outline:none;box-shadow:var(--ring)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ===== Home ===== */
.hero{
  position:relative;overflow:hidden;border-radius:22px;margin:4px 0 6px;
  padding:36px 32px 30px;background:var(--hero-grad);color:#fff;box-shadow:var(--shadow-lg);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(560px 240px at 90% -10%, rgba(255,255,255,.18), transparent 60%),
    radial-gradient(460px 240px at -6% 116%, rgba(217,122,147,.38), transparent 62%);
}
.hero::after{
  content:"桜";position:absolute;right:18px;bottom:-46px;pointer-events:none;
  font-size:170px;font-weight:700;line-height:1;color:rgba(255,255,255,.11);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  transform:rotate(-7deg);
}
.hero>*{position:relative;z-index:1}
.hero .kicker{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#F2C6D3}
.hero h1{font-size:clamp(28px,4.8vw,40px);line-height:1.15;margin:8px 0 10px;letter-spacing:-.02em;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(20,16,50,.35)}
.hero p.sub{color:rgba(255,255,255,.82);max-width:620px;font-size:15px}
.hero p.sub b{color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{
  background:var(--stat-bg);border:1px solid rgba(255,255,255,.22);border-radius:12px;
  padding:10px 16px;display:flex;align-items:baseline;gap:8px;
}
.stat b{font-size:20px;color:#fff}
.stat span{font-size:12.5px;color:rgba(255,255,255,.82)}
.hero .btn{
  background:var(--hero-btn-bg);border-color:rgba(255,255,255,.30);color:#fff;box-shadow:none;
}
.hero .btn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.55);color:#fff}
/* backdrop-filter dipakai hemat, hanya bila didukung; fallback = latar rgba di atas */
@supports ((backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px))){
  .stat{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .hero .btn{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .kj-backdrop{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
}
.searchbar{margin:24px 0 16px;position:relative}
.searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--text2)}
.searchbar input{
  width:100%;padding:13px 16px 13px 44px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none;box-shadow:var(--shadow);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.searchbar input::placeholder{color:var(--text2);opacity:.85}
.searchbar input:focus{border-color:var(--accent);box-shadow:var(--shadow), var(--ring)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.card{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px 16px;box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;
}
/* animasi masuk dibatasi hanya 12 kartu pertama demi performa */
.grid>.card:nth-child(-n+12){animation:rise .3s ease both}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--purple),var(--sakura));
  opacity:0;transition:opacity .18s ease;
}
.grid>.card:nth-child(2){animation-delay:.04s}
.grid>.card:nth-child(3){animation-delay:.08s}
.grid>.card:nth-child(4){animation-delay:.12s}
.grid>.card:nth-child(5){animation-delay:.16s}
.grid>.card:nth-child(6){animation-delay:.20s}
.grid>.card:nth-child(7){animation-delay:.24s}
.grid>.card:nth-child(8){animation-delay:.28s}
.card:hover{transform:translateY(-3px);border-color:rgba(62,79,168,.45);box-shadow:var(--shadow-lg)}
.card:hover::before{opacity:1}
.card .hari{font-size:12px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--accent)}
.card .done-badge{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-soft);border:1px solid rgba(76,128,85,.28);border-radius:99px;padding:2px 10px}
.card h3{font-size:15.5px;line-height:1.45;font-weight:700;letter-spacing:-.005em}
.card .kt{font-size:13px;color:var(--text2);display:flex;gap:6px;align-items:baseline}
.card .kt .tag{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--purple);background:var(--purple-soft);border-radius:5px;padding:2px 7px;text-transform:uppercase}
.card .kt.b .tag{color:var(--accent);background:var(--accent-soft)}
.empty{padding:44px 12px;text-align:center;color:var(--text2)}

/* ===== Shared ===== */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
  transition:transform .14s ease, border-color .14s ease, color .14s ease, background .14s ease;
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.done-on{border-color:rgba(76,128,85,.4);color:var(--green);background:var(--green-soft)}
.mini{font-size:12.5px;font-weight:600;color:var(--text2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;background:var(--card);box-shadow:var(--shadow);transition:border-color .14s ease, color .14s ease}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.spacer{flex:1}

/* ===== Bab view ===== */
.bab-head{padding:4px 2px 16px}
.bab-head .hari{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.bab-head h2{font-size:clamp(23px,3.8vw,31px);line-height:1.25;margin-top:3px;letter-spacing:-.015em;font-weight:800}
.tabs{display:inline-flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:20px}
.tab{padding:8px 18px;font-size:14px;font-weight:700;color:var(--text2);border-radius:999px;transition:color .14s ease, background .14s ease, box-shadow .14s ease}
.tab:hover{color:var(--text)}
.tab.on{background:var(--tab-on-bg);color:var(--accent);box-shadow:var(--tab-on-shadow)}
.toolrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* grammar point */
.gp{
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden;transition:border-color .15s ease, box-shadow .15s ease;
  animation:rise .3s ease both;
}
.gp:hover{border-color:rgba(62,79,168,.35)}
.gp.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.gp-head{width:100%;display:flex;align-items:center;gap:10px;padding:15px 18px;text-align:left}
.gp-head:hover{background:var(--accent-soft)}
.gp.open .gp-head{background:var(--accent-soft)}
.gp-head .pat{font-size:16.5px;font-weight:700;line-height:1.45}
.gp-head .arti{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 11px;white-space:nowrap}
.gp.open .gp-head .arti{background:var(--card)}
.gp-head .chev{flex:none;margin-left:auto;color:var(--text2);transition:transform .18s ease, color .18s ease;font-size:11px}
.gp.open .gp-head .chev{transform:rotate(90deg);color:var(--accent)}
.gp-body{display:none;padding:4px 20px 18px;border-top:1px dashed var(--line)}
.gp.open .gp-body{display:block}
.gp-body .rumus{background:var(--accent-soft);border:1px dashed rgba(62,79,168,.45);padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.7;margin:12px 0 4px}
.gp-body .note{font-size:13.5px;color:var(--text2);background:var(--bg2);border-radius:10px;padding:10px 13px;margin:10px 0 4px}
.gp-body .warn{font-size:13.5px;color:var(--orange);background:var(--orange-soft);border-radius:10px;padding:10px 13px;margin:10px 0 4px}
.exs{list-style:none;margin-top:12px}
.exs li{
  font-size:15.5px;padding:8px 12px 8px 15px;border-left:3px solid var(--accent-soft);margin:7px 0;line-height:1.75;
  border-radius:0 8px 8px 0;transition:border-color .15s ease, background .15s ease;
}
.exs li:hover{border-left-color:var(--accent);background:var(--accent-soft)}

/* kotoba */
.kt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.kt-head .theme{font-size:18px;font-weight:800;letter-spacing:-.01em}
.kt-head .sub{font-size:13px;color:var(--text2)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;margin-left:auto;box-shadow:var(--shadow);transition:border-color .14s ease, color .14s ease}
.switch:hover{border-color:var(--accent);color:var(--accent)}
.switch .dot{width:26px;height:15px;border-radius:99px;background:var(--switch-track-off);position:relative;transition:background .15s}
.switch .dot::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--switch-knob);box-shadow:0 1px 2px rgba(0,0,0,.22);transition:left .15s}
.switch.on{color:var(--accent);border-color:var(--accent)}
.switch.on .dot{background:var(--accent)}
.switch.on .dot::after{left:13px}
.hint{font-size:12.5px;color:var(--text2);margin:2px 0 10px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px}
.word{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.words>.word:nth-child(-n+12){animation:rise .3s ease both}
.words>.word:nth-child(2){animation-delay:.03s}
.words>.word:nth-child(3){animation-delay:.06s}
.words>.word:nth-child(4){animation-delay:.09s}
.words>.word:nth-child(5){animation-delay:.12s}
.words>.word:nth-child(6){animation-delay:.15s}
.word:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:rgba(138,95,168,.4)}
.word .w-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word .w{font-size:18px;font-weight:800}
.word .k{font-size:12.5px;color:var(--text2)}
.word .m{font-size:14px;color:var(--green);font-weight:700;margin-top:2px}
.word .ex{font-size:13px;color:var(--text2);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;line-height:1.7}
.word.veiled{cursor:pointer}
.word.veiled .m,.word.veiled .ex{filter:blur(6px);user-select:none;transition:filter .18s ease}
.word.veiled.shown .m,.word.veiled.shown .ex{filter:none}
.kt-none{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:36px 22px;text-align:center;color:var(--text2);font-size:14px}
.kt-none b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}

/* ===== Kanji flashcard ===== */
.kj-toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.kj-hint{font-size:12.5px;color:var(--text2);margin:2px 0 14px}
.kj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:6px}
.kj-card{position:relative;aspect-ratio:1/1;cursor:pointer;perspective:1200px;transition:transform .16s ease}
/* 104 kartu: animasi masuk hanya untuk 12 kartu pertama */
.kj-grid>.kj-card:nth-child(-n+12){animation:rise .3s ease both}
.kj-grid>.kj-card:nth-child(2){animation-delay:.03s}
.kj-grid>.kj-card:nth-child(3){animation-delay:.06s}
.kj-grid>.kj-card:nth-child(4){animation-delay:.09s}
.kj-grid>.kj-card:nth-child(5){animation-delay:.12s}
.kj-grid>.kj-card:nth-child(6){animation-delay:.15s}
.kj-grid>.kj-card:nth-child(7){animation-delay:.18s}
.kj-grid>.kj-card:nth-child(8){animation-delay:.21s}
.kj-card:hover{transform:translateY(-3px)}
.kj-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.kj-card.flip .kj-inner{transform:rotateY(180deg)}
.kj-face{
  position:absolute;inset:0;border-radius:16px;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;padding:10px;overflow:hidden;
}
.kj-front{align-items:center;justify-content:center;gap:4px;text-align:center;background:var(--grad);border:none;color:#fff}
.kj-front::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
  background:radial-gradient(circle at 82% 10%, rgba(255,255,255,.22), transparent 55%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.kj-front .kj-no{position:absolute;top:8px;left:10px;font-size:10.5px;color:rgba(255,255,255,.65);font-weight:700}
.kj-front .kj-ch{font-size:46px;font-weight:800;line-height:1;text-shadow:0 2px 8px rgba(15,10,40,.4)}
.kj-front .kj-tap{font-size:10px;color:rgba(255,255,255,.68);margin-top:4px}
.kj-back{transform:rotateY(180deg);overflow-y:auto;text-align:left;gap:5px}
.kj-back .kj-ch2{font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.kj-back .kj-baca{font-size:11.5px;color:var(--accent);font-weight:700}
.kj-back .kj-kata{list-style:none;font-size:11px;color:var(--text2);line-height:1.55}
.kj-back .kj-kalimat{font-size:10.5px;color:var(--text2);border-top:1px dashed var(--line);margin-top:2px;padding-top:4px;line-height:1.5}
.kj-back .kj-kalimat .jp{color:var(--text);display:block;margin-bottom:2px}
.kj-back::-webkit-scrollbar{width:6px}
.kj-back::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ===== Pop up detail kanji ===== */
.kj-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
.kj-backdrop{position:absolute;inset:0;background:rgba(18,16,30,.6)}
.kj-dialog{
  position:relative;width:100%;max-width:560px;max-height:min(88vh,720px);display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 18px 60px rgba(10,8,25,.35);overflow:hidden;animation:kjpop .18s ease;
}
@keyframes kjpop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.kj-close{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:var(--text2);background:var(--bg2);border:1px solid var(--line);transition:color .14s ease, border-color .14s ease}
.kj-close:hover{color:var(--red);border-color:var(--red)}
.kj-dialog-body{overflow-y:auto;padding:24px 24px 22px}
.kjm-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding-right:40px}
.kjm-ch{font-size:52px;font-weight:800;line-height:1;background:var(--grad);color:#fff;border-radius:16px;padding:16px 20px;box-shadow:var(--shadow-lg);text-shadow:0 2px 8px rgba(15,10,40,.35)}
.kjm-headinfo{display:flex;flex-direction:column;gap:3px}
.kjm-no{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.kjm-baca{font-size:15px;font-weight:700;color:var(--accent)}
.kjm-yomi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.kjm-yomibox{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--bg2)}
.kjm-yomibox .lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.kjm-yomibox.on .lbl{color:var(--accent)}
.kjm-yomibox.kun .lbl{color:var(--green)}
.kjm-yomibox.on{background:var(--accent-soft);border-color:rgba(62,79,168,.3)}
.kjm-yomibox.kun{background:var(--green-soft);border-color:rgba(76,128,85,.3)}
.kjm-yomibox .val{font-size:15.5px;font-weight:700;line-height:1.5}
.kjm-sec{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:18px 0 6px}
.kjm-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kjm-ju{list-style:none}
.kjm-ju li{display:flex;flex-wrap:wrap;gap:2px 8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.6}
.kjm-ju li:last-child{border-bottom:none}
.kjm-ju .wr{font-weight:700}
.kjm-ju .m{color:var(--green)}
.kjm-ex{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.7}
.kjm-ex .jp{display:block}
.kjm-ex .id{display:block;color:var(--text2);font-size:13px}
.kj-dialog-body::-webkit-scrollbar{width:8px}
.kj-dialog-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.pager{display:flex;gap:12px;margin-top:28px}
.pager .btn{flex:1;justify-content:center;padding:12px;border-radius:12px}
.pager .btn small{color:var(--text2);font-weight:400}
.footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2);text-align:center;line-height:1.8}
.footer::before{content:"❀";display:block;font-size:15px;color:var(--sakura);margin-bottom:8px}

@media (max-width:520px){
  .wrap{padding:16px 14px 52px}
  .hero{padding:26px 20px 24px;border-radius:18px}
  .hero::after{font-size:118px;bottom:-32px;right:6px}
  .stats{gap:8px}
  .stat{padding:8px 12px}
  .gp-head{flex-wrap:wrap}
  .gp-head .arti{order:3}
  .switch{margin-left:0}
  .tabs{width:100%;display:flex}
  .tab{flex:1;text-align:center;padding:9px 8px}
  .kj-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .kj-front .kj-ch{font-size:36px}
  .kjm-yomi{grid-template-columns:1fr}
  .kjm-ch{font-size:42px;padding:13px 16px}
  .kj-dialog-body{padding:18px 16px 16px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-delay:0ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    transition-delay:0ms !important;
  }
}

ruby{ruby-align:center}
ruby rt{font-size:.58em;color:var(--rt);font-weight:600;line-height:1;letter-spacing:0;user-select:none}
.k ruby rt,.w ruby rt{color:var(--rt)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const BUNPOU = [
{hari:1,bab:26,title:"〜んです・Minta Tolong & Minta Saran",points:[
 {p:"〜んです",rumus:"Bentuk biasa + んです（KB・KS-な: 〜なんです）",arti:"menjelaskan / menanyakan alasan",note:"Pakai ini saat kamu penasaran, atau saat memberi alasan. Caranya: bentuk biasa + んです. Rasanya seperti “memangnya kenapa…?” / “soalnya…” dalam bahasa Indonesia.",warn:"Jangan pakai 〜んです di kalimat biasa yang tidak butuh alasan — kesannya jadi aneh.",ex:["どうして 遅れたんですか。= Kenapa kamu terlambat? (penasaran)","バスが 来なかったんです。= Soalnya bus tidak datang. (memberi alasan)","かわいい くつですね。どこで 買ったんですか。= Sepatunya lucu! Belinya di mana sih?"]},
 {p:"〜ていただけませんか",rumus:"KK bentuk て + いただけませんか",arti:"bisakah Anda… (sangat sopan)",note:"Cara paling sopan untuk minta tolong. Lebih halus daripada 〜てください.",ex:["いい 先生を 紹介して いただけませんか。= Bisakah Anda mengenalkan guru yang baik?","もう一度 説明して いただけませんか。= Bisakah dijelaskan sekali lagi?"]},
 {p:"Kata tanya + 〜たら いいですか",rumus:"Kata tanya + KK bentuk た + ら + いいですか",arti:"sebaiknya … bagaimana?",note:"Untuk minta saran atau petunjuk. Artinya “enaknya … gimana ya?”.",ex:["どこで カメラを 買ったら いいですか。= Sebaiknya beli kamera di mana ya?","ごみは どこに 出したら いいですか。= Sebaiknya buang sampah di mana?"]}
]},
{hari:2,bab:27,title:"Bentuk “Bisa” (可能形)・見えます/聞こえます・しか〜ない",points:[
 {p:"Kata kerja bentuk bisa",rumus:"G1: bunyi i → e（かきます→かけます）｜G2: + られます（たべられます）｜G3: します→できます・きます→こられます｜objek pakai が",arti:"bisa melakukan…",note:"Grup 1: bunyi “i” → “e” (かきます→かけます). Grup 2: + られます (たべます→たべられます). Khusus: します→できます、きます→こられます. Objeknya berubah dari を menjadi が.",ex:["日本語が 話せます。= Saya bisa berbicara bahasa Jepang.","漢字が 少し 読めます。= Saya bisa membaca kanji sedikit.","あしたは 来られません。= Besok saya tidak bisa datang."]},
 {p:"見えます・聞こえます",rumus:"KB が + 見えます／聞こえます",arti:"terlihat / terdengar (dengan sendirinya)",note:"Dipakai kalau sesuatu masuk ke mata/telinga secara alami, tanpa kita berusaha melihat/mendengar.",ex:["窓から 海が 見えます。= Dari jendela terlihat laut.","となりの 部屋から 声が 聞こえます。= Dari kamar sebelah terdengar suara orang."]},
 {p:"できます",rumus:"KB が + できます",arti:"sudah jadi / berdiri / selesai",ex:["駅の 前に 大きい スーパーが できました。= Di depan stasiun sudah berdiri supermarket besar.","新しい 道が できました。= Jalan baru sudah jadi."]},
 {p:"しか + kalimat negatif",rumus:"KB + しか + bentuk negatif（〜ません）",arti:"hanya / cuma",note:"Selalu berpasangan dengan bentuk negatif. Rasanya: “cuma segini, kurang!”.",ex:["ひらがなしか 書けません。= Saya cuma bisa menulis hiragana.","100円しか ありません。= Saya cuma punya 100 yen."]},
 {p:"〜は〜が、〜は〜",rumus:"A は 〜が、B は 〜（kontras A vs B）",arti:"membandingkan dua hal",ex:["ワインは 飲みますが、ビールは 飲みません。= Kalau wine saya minum, tapi kalau bir tidak."]}
]},
{hari:3,bab:28,title:"〜ながら・〜ています (kebiasaan)・〜し、〜し",points:[
 {p:"〜ながら",rumus:"KK bentuk ます（buang ます）+ ながら、+ KK utama",arti:"sambil…",note:"Bentuk ます (buang ます-nya) + ながら. Kegiatan yang lebih penting ditaruh di belakang.",ex:["音楽を 聞きながら 勉強します。= Belajar sambil mendengarkan musik.","コーヒーを 飲みながら 話しましょう。= Ayo ngobrol sambil minum kopi."]},
 {p:"〜ています (kebiasaan)",rumus:"KK bentuk て + います",arti:"rutin melakukan…",note:"Selain “sedang”, 〜ています juga dipakai untuk kebiasaan yang diulang-ulang setiap hari.",ex:["毎朝 ジョギングを して います。= Setiap pagi saya rutin jogging.","妹は 銀行で 働いて います。= Adik saya bekerja di bank."]},
 {p:"〜し、〜し",rumus:"Bentuk biasa + し、bentuk biasa + し、〜",arti:"…, lagipula… (alasan lebih dari satu)",note:"Untuk menyebutkan beberapa alasan sekaligus. Kesannya: masih ada alasan lain lagi.",ex:["田中先生は 親切だし、教え方も 上手だし、人気が あります。= Pak/Bu Tanaka ramah, cara mengajarnya bagus pula, jadi populer.","この 店は 安いし、おいしいし、よく 来ます。= Warung ini murah, enak pula — saya sering ke sini."]}
]},
{hari:4,bab:29,title:"〜ています (keadaan)・〜てしまいました",points:[
 {p:"KK intransitif + ています",rumus:"KB が + KK intransitif bentuk て + います",arti:"dalam keadaan…",note:"Menggambarkan keadaan yang terlihat SEKARANG. まどが開いています = jendelanya (sekarang) terbuka. Pakai partikel が.",ex:["まどが 開いて います。= Jendelanya terbuka.","電気が ついて います。= Lampunya menyala.","この いすは 壊れて います。= Kursi ini rusak."]},
 {p:"Transitif ⇔ Intransitif",rumus:"を + KK transitif（ドアを あけます）⇔ が + KK intransitif（ドアが あきます）",arti:"membuka ⇔ terbuka",note:"Transitif = kita yang melakukan (pakai を). Intransitif = terjadi sendiri (pakai が). Contoh pasangan: 開けます⇔開きます、閉めます⇔閉まります、つけます⇔つきます、消します⇔消えます、壊します⇔壊れます.",ex:["ドアを 開けます。= Saya membuka pintu. (sengaja)","ドアが 開きます。= Pintunya terbuka. (sendiri)"]},
 {p:"〜てしまいました",rumus:"KK bentuk て + しまいました",arti:"terlanjur… / selesai total",note:"Dua rasa: ① menyesal — “aduh, terlanjur!” ② benar-benar selesai semuanya.",ex:["電車の 中に かばんを 忘れて しまいました。= Aduh, tas saya tertinggal di kereta.","パスポートを なくして しまいました。= Paspor saya hilang (gawat).","宿題は もう やって しまいました。= PR sudah selesai semuanya."]}
]},
{hari:5,bab:30,title:"〜てあります・〜ておきます・まだ〜ています",points:[
 {p:"〜てあります",rumus:"KB が + KK transitif bentuk て + あります",arti:"sudah di-… (hasil persiapan)",note:"Menunjukkan sesuatu yang sudah sengaja disiapkan seseorang, dan hasilnya masih terlihat. Pakai partikel が.",ex:["カレンダーに 今月の 予定が 書いて あります。= Di kalender sudah tertulis jadwal bulan ini.","ビールは 冷蔵庫に 入れて あります。= Bir sudah dimasukkan ke kulkas."]},
 {p:"〜ておきます",rumus:"KK bentuk て + おきます",arti:"melakukan… sebagai persiapan",note:"① Menyiapkan sesuatu sebelum dibutuhkan. ② Membereskan kembali. ③ そのままにしておく = membiarkan apa adanya.",ex:["旅行の 前に 切符を 買って おきます。= Sebelum wisata, saya beli tiket dulu.","はさみは 使ったら、元の 所に 戻して おいて ください。= Kalau sudah pakai gunting, kembalikan ke tempat semula ya.","そのままに して おいて ください。= Biarkan saja seperti itu."]},
 {p:"まだ + kalimat positif",rumus:"まだ + kalimat positif（まだ あります・まだ 〜ています）",arti:"masih…",ex:["まだ 雨が 降って います。= Masih hujan.","まだ 時間が ありますから、ゆっくり 行きましょう。= Masih ada waktu, ayo jalan pelan-pelan saja."]}
]},
{hari:6,bab:31,title:"Bentuk Niat (意向形)・つもり・予定",points:[
 {p:"Bentuk 〜(よ)う",rumus:"G1: bunyi u → o + う（いく→いこう）｜G2: + よう（たべよう）｜G3: する→しよう・くる→こよう",arti:"ayo… / mau… (versi santai ましょう)",note:"Grup 1: bunyi “i”→“o” + う (いきます→いこう). Grup 2: + よう (たべよう). Khusus: します→しよう、きます→こよう.",ex:["ちょっと 休もう。= Istirahat dulu, yuk.","もう 遅いから、帰ろう。= Sudah malam, ayo pulang."]},
 {p:"〜(よ)うと 思っています",rumus:"KK bentuk maksud（〜よう）+ と 思っています",arti:"berniat akan…",note:"Niat yang sudah dipikirkan sejak lama dan masih berlanjut sampai sekarang.",ex:["日本の 会社で 働こうと 思って います。= Saya berniat bekerja di perusahaan Jepang.","週末、京都へ 行こうと 思って います。= Akhir pekan ini saya berniat pergi ke Kyoto."]},
 {p:"〜つもりです",rumus:"KK bentuk kamus／KK bentuk ない + つもりです",arti:"berencana… (tekad kuat)",ex:["来年、国へ 帰る つもりです。= Tahun depan saya berencana pulang ke negara saya.","たばこは もう 吸わない つもりです。= Saya bertekad tidak merokok lagi."]},
 {p:"〜予定です",rumus:"KK bentuk kamus + 予定です｜KB + の + 予定です",arti:"dijadwalkan…",ex:["会議は ３時に 終わる 予定です。= Rapat dijadwalkan selesai jam 3.","来月、大阪へ 出張する 予定です。= Bulan depan saya dijadwalkan dinas ke Osaka."]},
 {p:"まだ〜ていません",rumus:"まだ + KK bentuk て + いません",arti:"belum…",ex:["レポートは まだ 書いて いません。= Laporan belum saya tulis.","昼ご飯は まだ 食べて いません。= Saya belum makan siang."]}
]},
{hari:7,bab:32,title:"〜たほうがいい・〜でしょう・〜かもしれません",points:[
 {p:"〜たほうがいいです / 〜ないほうがいいです",rumus:"KK bentuk た + ほうが いいです｜KK bentuk ない + ほうが いいです",arti:"sebaiknya (jangan)…",note:"Untuk memberi saran. Positif pakai bentuk た, negatif pakai bentuk ない.",ex:["熱が あるんです。→ じゃ、早く 寝た ほうが いいですよ。= Kalau begitu, sebaiknya cepat tidur.","あまり お酒を 飲まない ほうが いいですよ。= Sebaiknya jangan banyak minum alkohol."]},
 {p:"〜でしょう",rumus:"Bentuk biasa + でしょう（sering dipakai dengan たぶん）",arti:"mungkin / pasti (dugaan kuat)",note:"Dugaan yang cukup yakin. Sering bersama たぶん. Dipakai juga di ramalan cuaca.",ex:["あしたは 雨が 降るでしょう。= Besok kemungkinan besar hujan.","田中さんは たぶん 来るでしょう。= Tanaka mungkin akan datang."]},
 {p:"〜かもしれません",rumus:"Bentuk biasa + かもしれません（sering dipakai dengan もしかしたら）",arti:"mungkin (belum yakin)",note:"Kemungkinannya lebih kecil daripada でしょう. Sering bersama もしかしたら.",ex:["約束に 間に合わないかも しれません。= Mungkin saya tidak sempat tiba tepat waktu.","もしかしたら 来年 日本へ 行けるかも しれません。= Mungkin saja tahun depan saya bisa pergi ke Jepang."]}
]},
{hari:8,bab:33,title:"Bentuk Perintah & Larangan・〜という意味・〜と言っていました",points:[
 {p:"Bentuk perintah (命令形) & larangan (禁止形)",rumus:"Perintah G1: bunyi i → e（いそげ）｜G2: + ろ（たべろ）｜Larangan: bentuk kamus + な（入るな）",arti:"lakukan! / jangan!",note:"Perintah: Grup 1 bunyi “i”→“e” (いそぎます→いそげ), Grup 2 + ろ (たべろ). Larangan: bentuk kamus + な (はいるな). Kesannya kasar — hanya untuk keadaan darurat, olahraga, atau rambu-rambu.",warn:"Jangan pakai bentuk ini ke atasan atau orang yang tidak akrab — sangat kasar.",ex:["急げ！= Cepat!","にげろ！= Lari! (darurat)","ここに 入るな。= Jangan masuk sini!"]},
 {p:"〜と 読みます / 〜と 書いてあります",rumus:"「〜」+ と 読みます／と 書いてあります",arti:"dibaca… / tertulis…",ex:["あの 漢字は 「きんえん」と 読みます。= Kanji itu dibaca “kin'en”.","あそこに 「止まれ」と 書いて あります。= Di sana tertulis “berhenti”."]},
 {p:"〜は 〜という 意味です",rumus:"KB／「〜」+ は + 〜という 意味です",arti:"artinya adalah…",ex:["「立入禁止」は 入るなという 意味です。= “Tachiiri kinshi” artinya dilarang masuk.","この マークは 洗濯できるという 意味です。= Tanda ini artinya boleh dicuci."]},
 {p:"〜と 言っていました",rumus:"「kalimat」／bentuk biasa + と 言っていました",arti:"(dia) bilang…",note:"Untuk menyampaikan ucapan orang lain.",ex:["田中さんは あした 来ると 言って いました。= Tanaka bilang besok akan datang."]},
 {p:"〜と 伝えていただけませんか",rumus:"Bentuk biasa + と 伝えていただけませんか",arti:"tolong sampaikan bahwa…",ex:["ワンさんに 電話を くださいと 伝えて いただけませんか。= Bisakah Anda sampaikan ke Wan agar menelepon saya?"]}
]},
{hari:9,bab:34,title:"〜とおりに・〜あとで・〜て/〜ないで",points:[
 {p:"〜とおりに",rumus:"KK bentuk kamus・た + とおりに｜KB + の + とおりに",arti:"sesuai / sama seperti…",note:"Melakukan sesuatu persis seperti yang dilihat, didengar, atau dibaca.",ex:["わたしが やるとおりに、やって ください。= Lakukan persis seperti yang saya lakukan.","説明書のとおりに、組み立てました。= Saya merakitnya sesuai buku petunjuk."]},
 {p:"〜あとで",rumus:"KK bentuk た + あとで｜KB + の + あとで",arti:"setelah…",note:"Bentuk た + あとで, atau kata benda + のあとで. Lebih tegas urutannya daripada 〜てから.",ex:["仕事が 終わった あとで、飲みに 行きます。= Setelah pekerjaan selesai, saya pergi minum.","会議の あとで、電話します。= Setelah rapat, saya akan menelepon."]},
 {p:"KK1て + KK2",rumus:"KK1 bentuk て + KK2（KK1 = cara melakukan KK2）",arti:"melakukan KK2 dengan cara KK1",ex:["しょうゆを つけて 食べます。= Makan dengan dicelup kecap asin.","バスに 乗って 会社へ 行きます。= Pergi ke kantor naik bus."]},
 {p:"〜ないで",rumus:"KK bentuk ない + で、+ kalimat",arti:"tanpa… / bukannya… malah…",note:"① Melakukan sesuatu TANPA melakukan hal lain. ② Memilih A, bukan B.",ex:["砂糖を 入れないで コーヒーを 飲みます。= Minum kopi tanpa gula.","日曜日は どこも 行かないで、うちで ゆっくり 休みます。= Hari Minggu tidak pergi ke mana-mana, santai saja di rumah."]}
]},
{hari:10,bab:35,title:"Bentuk 〜ば (Pengandaian)・〜なら",points:[
 {p:"Bentuk 〜ば",rumus:"G1: bunyi i → e + ば（いけば）｜G2: + れば（たべれば）｜KS-い: buang い + ければ（やすければ）｜Negatif: 〜なければ",arti:"kalau…",note:"Grup 1: bunyi “i”→“e” + ば (いきます→いけば). Grup 2: + れば (たべれば). Kata sifat い: buang い + ければ (やすい→やすければ). Negatif: なければ.",ex:["この ボタンを 押せば、窓が 開きます。= Kalau tombol ini ditekan, jendela akan terbuka.","安ければ、買います。= Kalau murah, saya beli.","時間が なければ、行きません。= Kalau tidak ada waktu, saya tidak pergi."]},
 {p:"Kata tanya + 〜ば いいですか",rumus:"Kata tanya + bentuk ば + いいですか",arti:"sebaiknya … bagaimana?",note:"Mirip 〜たらいいですか di Bab 26 — untuk minta saran.",ex:["どこで 切符を 買えば いいですか。= Sebaiknya beli tiket di mana?","詳しい ことは だれに 聞けば いいですか。= Detailnya sebaiknya tanya siapa?"]},
 {p:"〜なら",rumus:"KB + なら、+ info / saran",arti:"kalau soal…",note:"Dipakai untuk menanggapi topik yang disebut lawan bicara, lalu memberi info atau saran.",ex:["温泉に 行きたいんですが…→ 温泉なら、白馬が いいですよ。= Kalau soal onsen, Hakuba bagus lho.","パソコンなら、あの 店が 安いですよ。= Kalau (mau beli) komputer, toko itu murah."]}
]},
{hari:11,bab:36,title:"〜ように・〜ようになりました・〜ようにしています",points:[
 {p:"〜ように (tujuan)",rumus:"KK potensial／KK bentuk ない + ように、+ kalimat usaha",arti:"supaya…",note:"Dipakai dengan kata kerja yang tidak bisa kita kendalikan (bisa, terlihat, sembuh, dll.) atau bentuk negatif.",ex:["早く 治るように、薬を 飲みます。= Supaya cepat sembuh, saya minum obat.","忘れないように、メモします。= Supaya tidak lupa, saya mencatat."]},
 {p:"〜ようになりました",rumus:"KK potensial + ように なりました｜Negatif: 〜なく なりました",arti:"sekarang jadi bisa…",note:"Menunjukkan perubahan: dulu tidak bisa → sekarang bisa. Negatifnya: 〜なくなりました (jadi tidak… lagi).",ex:["日本語が 話せるように なりました。= Sekarang saya jadi bisa berbicara bahasa Jepang.","ニュースが わかるように なりました。= Sekarang saya jadi mengerti berita (bahasa Jepang).","甘い 物を 食べなく なりました。= Saya jadi tidak makan makanan manis lagi."]},
 {p:"〜ようにしています / 〜ようにしてください",rumus:"KK bentuk kamus・ない + ように しています／ように してください",arti:"membiasakan diri… / usahakan…",note:"しています = usaha yang dibiasakan terus. してください = permintaan yang halus.",ex:["毎日 日記を 書くように して います。= Saya membiasakan diri menulis buku harian setiap hari.","時間を 守るように して ください。= Tolong usahakan selalu tepat waktu."]}
]},
{hari:12,bab:37,title:"Bentuk Pasif (受身)",points:[
 {p:"Cara membentuk pasif (〜れます/〜られます)",rumus:"G1: bunyi i → a + れます（かきます→かかれます）｜G2: + られます（たべられます）｜G3: します→されます・きます→こられます",arti:"di-… (oleh seseorang)",note:"Grup 1: bunyi “i”→“a” + れます (かきます→かかれます). Grup 2: + られます (たべられます). Khusus: します→されます、きます→こられます. Pelakunya ditandai に.",ex:["先生に ほめられました。= Saya dipuji guru.","母に しかられました。= Saya dimarahi ibu."]},
 {p:"Pasif “merasa dirugikan”",rumus:"Saya は + orang に + (KB を) + KK pasif",arti:"kena… (menyebalkan)",note:"Khas bahasa Jepang: dipakai saat kita dirugikan oleh perbuatan orang lain.",ex:["隻の 人に 足を 踏まれました。= Kaki saya terinjak orang di sebelah.","弟に ケーキを 食べられました。= Kue saya dimakan adik (nyebelin!).","雨に 降られました。= Saya kehujanan."]},
 {p:"Pasif untuk fakta umum",rumus:"KB は/が + KK pasif（pelaku tidak perlu disebut）",arti:"di-… (netral)",note:"Untuk benda atau kejadian umum. Pelakunya tidak penting disebut.",ex:["この 本は 世界中で 読まれて います。= Buku ini dibaca di seluruh dunia.","来月、会議が 開かれます。= Bulan depan rapat akan diadakan.","日本の 車は 世界へ 輸出されて います。= Mobil Jepang diekspor ke seluruh dunia."]}
]},
{hari:13,bab:38,title:"Nominalisasi の (〜のは/〜のが/〜のを)",points:[
 {p:"〜のは 〜です",rumus:"KK bentuk kamus + のは + KS です",arti:"me-… itu …",note:"の mengubah kata kerja menjadi “kegiatan”. Seperti kata “nya”: menghafal kanji itu…",ex:["漢字を 覚えるのは 大変です。= Menghafal kanji itu berat.","朋だちと 話すのは 楽しいです。= Ngobrol dengan teman itu menyenangkan."]},
 {p:"〜のが 好き/上手/下手",rumus:"KK bentuk kamus + のが + 好き／上手／下手 です",arti:"suka/pandai/tidak pandai me-…",ex:["サッカーを 見るのが 好きです。= Saya suka menonton sepak bola.","妹は 絵を かくのが 上手です。= Adik saya pandai menggambar."]},
 {p:"〜のを 忘れました",rumus:"KK bentuk kamus + のを + 忘れました",arti:"lupa untuk…",ex:["牛乳を 買うのを 忘れました。= Saya lupa membeli susu.","宿題を 持って くるのを 忘れました。= Saya lupa membawa PR."]},
 {p:"〜のを 知っていますか",rumus:"Bentuk biasa + のを + 知っていますか",arti:"tahukah kamu bahwa…",ex:["田中さんが 結婚するのを 知って いますか。= Kamu tahu tidak kalau Tanaka akan menikah?"]},
 {p:"〜のは 〜です (penekanan)",rumus:"Bagian keterangan + のは + bagian yang ditekankan + です",arti:"yang … adalah …",ex:["初めて 日本へ 来たのは １０年前です。= Pertama kali saya datang ke Jepang adalah 10 tahun lalu."]}
]},
{hari:14,bab:39,title:"〜て/〜くて (sebab)・〜ので・途中で",points:[
 {p:"〜て/〜くて (sebab)",rumus:"KK bentuk て｜KS-い: buang い + くて｜KS-な・KB: + で、+ akibat/perasaan",arti:"karena… (perasaan/keadaan)",note:"Bentuk て juga bisa menyatakan sebab, terutama untuk perasaan (senang, kaget, cemas) atau keadaan yang tak bisa diubah.",warn:"Setelahnya TIDAK boleh ada ajakan/perintah. Kalau mau memerintah, pakai から atau ので.",ex:["ニュースを 聞いて、びっくりしました。= Mendengar berita itu, saya kaget.","事故が あって、バスが 遅れました。= Karena ada kecelakaan, bus terlambat.","問題が 難しくて、わかりませんでした。= Karena soalnya sulit, saya tidak mengerti."]},
 {p:"〜ので",rumus:"Bentuk biasa + ので（KS-な・KB: 〜なので）",arti:"karena… (halus & objektif)",note:"Lebih halus dan sopan daripada から. Cocok untuk memberi alasan atau minta izin dengan sopan. Kata benda/な-adj: pakai なので.",ex:["用事が あるので、お先に 帰ります。= Karena ada keperluan, saya pulang duluan.","日本語が わからないので、英語で 話して いただけませんか。= Karena saya tidak paham bahasa Jepang, bisakah bicara dalam bahasa Inggris?"]},
 {p:"途中で",rumus:"KK bentuk kamus + 途中で｜KB + の + 途中で",arti:"di tengah jalan / di tengah-tengah",ex:["マラソンの 途中で 気分が 悪くなりました。= Di tengah maraton, badan saya jadi tidak enak.","途中で 事故が ありました。= Di tengah jalan ada kecelakaan."]}
]},
{hari:15,bab:40,title:"Kata tanya + か・〜かどうか・〜てみます",points:[
 {p:"Kata tanya + か",rumus:"Kata tanya + bentuk biasa + か、+ kalimat",arti:"(tidak tahu) kapan/apa/siapa…",note:"Memasukkan pertanyaan ke dalam kalimat. Setelah kata tanya + bentuk biasa + か.",ex:["会議が いつ 終わるか、わかりません。= Saya tidak tahu kapan rapat selesai.","どこで 買ったか、覚えて いません。= Saya tidak ingat belinya di mana."]},
 {p:"〜かどうか",rumus:"Bentuk biasa + かどうか、+ kalimat",arti:"apakah … atau tidak",note:"Untuk pertanyaan ya/tidak (tanpa kata tanya).",ex:["あした 雨が 降るかどうか、わかりません。= Saya tidak tahu besok hujan atau tidak.","間違いが ないかどうか、確かめて ください。= Tolong periksa ada kesalahan atau tidak."]},
 {p:"〜てみます",rumus:"KK bentuk て + みます",arti:"mencoba…",note:"Melakukan sesuatu untuk melihat hasilnya — “coba dulu deh”.",ex:["この くつを はいても いいですか。→ どうぞ、はいて みて ください。= Silakan dicoba (sepatunya).","もう一度 考えて みます。= Saya akan coba pikirkan sekali lagi."]}
]},
{hari:16,bab:41,title:"Memberi & Menerima (くださいます/いただきます/やります)",points:[
 {p:"くださいます・いただきます・やります",rumus:"Atasan は くださいます｜saya は atasan に いただきます｜saya は bawahan・hewan に やります",arti:"memberi (ke saya) / menerima / memberi (ke bawahan)",note:"くださいます = orang yang lebih tinggi memberi kepada saya. いただきます = saya menerima dari orang yang lebih tinggi. やります = memberi ke adik/hewan/tanaman.",ex:["部長は わたしに お土産を くださいました。= Kepala bagian memberi saya oleh-oleh.","わたしは 先生に 辞書を いただきました。= Saya menerima kamus dari guru.","犬に えさを やります。= Memberi makan anjing."]},
 {p:"〜てくださいます / 〜てくれます",rumus:"KK bentuk て + くださいます（hormat）／くれます（netral）",arti:"(dia) berbaik hati me-… untuk saya",ex:["部長の 奥さんは お茶を 教えて くださいました。= Istri kepala bagian mengajari saya upacara minum teh.","友だちが 引っ越しを 手伝って くれました。= Teman membantu saya pindahan."]},
 {p:"〜ていただきました",rumus:"KK bentuk て + いただきました",arti:"saya di-…-kan (dengan rasa terima kasih)",ex:["先生に 作文を 直して いただきました。= Karangan saya dikoreksi oleh guru (saya berterima kasih)."]},
 {p:"〜てあげます / 〜てやります",rumus:"KK bentuk て + あげます／やります",arti:"melakukan… untuk orang lain",warn:"〜てあげます terdengar sombong jika diucapkan langsung ke orangnya. Ke anak kecil/hewan pakai 〜てやります.",ex:["息子に 紙飛行機を 作って やりました。= Saya membuatkan pesawat kertas untuk anak saya."]}
]},
{hari:17,bab:42,title:"〜ために・〜のに",points:[
 {p:"〜ために",rumus:"KK bentuk kamus + ために｜KB + の + ために",arti:"untuk / demi…",note:"Tujuan yang disengaja. Kata benda + のために, atau bentuk kamus + ために.",ex:["家を 買うために、貯金して います。= Saya menabung untuk membeli rumah.","健康のために、毎日 運動して います。= Demi kesehatan, saya olahraga setiap hari.","家族のために、働いて います。= Saya bekerja demi keluarga."]},
 {p:"〜のに 使います/便利です",rumus:"KK bentuk kamus + のに + 使います／便利です",arti:"berguna untuk…",note:"Menjelaskan fungsi suatu benda.",ex:["この はさみは 花を 切るのに 使います。= Gunting ini dipakai untuk memotong bunga.","この かばんは 旅行に 便利です。= Tas ini praktis untuk bepergian."]},
 {p:"Jumlah + は / も",rumus:"Angka + は = paling tidak segitu｜Angka + も = sampai segitu (banyak!)",arti:"paling tidak… / sampai… (banyaknya!)",note:"は = minimal segitu. も = menekankan “banyak sekali”.",ex:["駅まで １０分は かかります。= Ke stasiun paling tidak butuh 10 menit.","この 時計は １０万円も しました。= Jam ini harganya sampai 100 ribu yen (mahal sekali)."]}
]},
{hari:18,bab:43,title:"〜そうです (kelihatannya)・〜てきます",points:[
 {p:"〜そうです (dari penglihatan)",rumus:"KK bentuk ます（buang ます）+ そうです（降りそう）｜KS: buang い/な + そうです（おいしそう・いい→よさそう）",arti:"kelihatannya… / sepertinya mau…",note:"Dugaan dari apa yang KITA LIHAT sekarang. KK: bentuk ます tanpa ます + そう (降りそう). Kata sifat い: buang い (おいしそう). Khusus: いい→よさそう.",warn:"Bedakan dengan 〜そうです “katanya” di Bab 47! Yang ini dugaan dari mata sendiri.",ex:["今にも 雨が 降りそうです。= Kelihatannya sebentar lagi hujan.","この ケーキは おいしそうですね。= Kue ini kelihatannya enak ya.","ボタンが 取れそうですよ。= Kancingmu kelihatannya mau lepas lho."]},
 {p:"〜てきます",rumus:"KK bentuk て + きます",arti:"pergi sebentar lalu kembali",note:"Melakukan sesuatu di tempat lain, lalu balik lagi ke sini.",ex:["ちょっと たばこを 買って きます。= Saya pergi beli rokok sebentar (lalu kembali).","すぐ 戻りますから、見て きます。= Saya lihat dulu sebentar, segera kembali."]}
]},
{hari:19,bab:44,title:"〜すぎます・〜やすい/〜にくい・〜く/にします",points:[
 {p:"〜すぎます",rumus:"KK bentuk ます（buang ます）+ すぎます｜KS: buang い/な + すぎます",arti:"terlalu…",note:"Bentuk ます tanpa ます + すぎます. Kata sifat: buang い/な + すぎます.",ex:["ゆうべ お酒を 飲みすぎました。= Tadi malam saya minum terlalu banyak.","この 問題は 難しすぎます。= Soal ini terlalu sulit."]},
 {p:"〜やすいです / 〜にくいです",rumus:"KK bentuk ます（buang ます）+ やすいです／にくいです",arti:"mudah di-… / susah di-…",ex:["この ペンは 書きやすいです。= Pena ini enak dipakai menulis.","東京は 住みやすいですか。= Apakah Tokyo nyaman ditinggali?","この 薬は 苦くて、飲みにくいです。= Obat ini pahit, susah diminum."]},
 {p:"〜くします / 〜にします",rumus:"KS-い: buang い + くします（小さくします）｜KS-な・KB: + にします（きれいにします）",arti:"membuat jadi…",note:"Kata sifat い: buang い + くします (やすくします). Kata sifat な/benda: + にします.",ex:["音を 小さくして ください。= Tolong kecilkan suaranya.","部屋を きれいに しました。= Saya membuat kamar jadi bersih."]},
 {p:"〜にします (memilih)",rumus:"KB + にします",arti:"saya pilih…",ex:["飲み物は コーヒーに します。= Minumannya, saya pilih kopi.","会議は あしたに しましょう。= Rapatnya kita jadwalkan besok saja."]}
]},
{hari:20,bab:45,title:"〜場合は・〜のに",points:[
 {p:"〜場合は",rumus:"KK bentuk kamus・た・ない + 場合は｜KB + の + 場合は",arti:"jika terjadi… / seandainya…",note:"Untuk membicarakan cara menghadapi situasi tertentu (biasanya masalah). KK bentuk kamus/た/ない + 場合は. Kata benda + の場合は.",ex:["会議に 間に合わない 場合は、連絡して ください。= Jika tidak sempat datang ke rapat, tolong hubungi kami.","領収書が ない 場合は、お金を 返せません。= Jika tidak ada kuitansi, uang tidak bisa dikembalikan.","火事の 場合は、エレベーターを 使わないで ください。= Jika terjadi kebakaran, jangan gunakan lift."]},
 {p:"〜のに",rumus:"Bentuk biasa + のに（KS-な・KB: 〜なのに）",arti:"padahal…",note:"Menunjukkan hasil yang berlawanan dengan harapan — ada rasa kecewa, heran, atau menyesal. Lebih emosional daripada が/でも.",ex:["約束を したのに、彼は 来ませんでした。= Padahal sudah janji, dia tidak datang.","今日は 日曜日なのに、働かなければ なりません。= Padahal hari ini Minggu, saya harus kerja.","たくさん 勉強したのに、合格できませんでした。= Padahal sudah belajar keras, saya tidak lulus."]}
]},
{hari:21,bab:46,title:"〜ところです・〜たばかり・〜はずです",points:[
 {p:"〜ところです",rumus:"Bentuk kamus + ところ（baru mau）｜〜ている + ところ（sedang）｜〜た + ところ（baru saja selesai）",arti:"tepat saat…",note:"Tiga pola: bentuk kamus + ところ = baru MAU mulai. 〜ているところ = SEDANG berlangsung. 〜たところ = BARU SAJA selesai.",ex:["これから 出かけるところです。= Saya baru mau berangkat.","今、調べて いるところです。= Sekarang sedang saya periksa.","たった今、帰って きたところです。= Saya baru saja pulang."]},
 {p:"〜たばかりです",rumus:"KK bentuk た + ばかりです",arti:"baru saja…",note:"Merasa waktunya masih baru. Boleh untuk kejadian yang sudah agak lama, asal terasa “masih baru” (misal: baru beli bulan lalu).",ex:["さっき 昼ご飯を 食べたばかりです。= Saya baru saja makan siang.","先月 買ったばかりなのに、もう 壊れました。= Padahal baru dibeli bulan lalu, sudah rusak."]},
 {p:"〜はずです",rumus:"Bentuk biasa + はずです（KS-な: 〜なはず・KB: 〜のはず）",arti:"seharusnya / pasti…",note:"Dugaan yang sangat yakin karena ada dasarnya (jadwal, kebiasaan, dll.).",ex:["田中さんは 今日 来るはずです。= Tanaka seharusnya datang hari ini.","ワンさんは 中国人だから、中国語が 話せるはずです。= Wan orang Tiongkok, jadi pasti bisa bahasa Mandarin."]}
]},
{hari:22,bab:47,title:"〜そうです (katanya)・〜ようです",points:[
 {p:"〜そうです (dari informasi)",rumus:"Bentuk biasa + そうです（〜によると、…そうです）",arti:"katanya…",note:"Menyampaikan informasi yang didengar/dibaca, tanpa mengubahnya. Bentuk biasa + そうです. Sumbernya: 〜によると (menurut…).",warn:"Beda dengan Bab 43! 雨が降りそうです = kelihatannya mau hujan (lihat langit). 雨が降るそうです = katanya akan hujan (dengar berita).",ex:["天気予報によると、あしたは 寒くなるそうです。= Menurut ramalan cuaca, katanya besok akan dingin.","田中さんは 結婚するそうです。= Katanya Tanaka akan menikah.","あの 店の ラーメンは おいしいそうです。= Katanya ramen di warung itu enak."]},
 {p:"〜ようです",rumus:"Bentuk biasa + ようです（KS-な: 〜なよう・KB: 〜のよう）",arti:"sepertinya… (dugaan sendiri)",note:"Dugaan berdasarkan apa yang kita lihat/dengar/rasakan sendiri, lalu kita simpulkan. Bentuk biasa + ようです (な-adj: なよう, benda: のよう).",ex:["人が 大勢 いますね。事故のようです。= Banyak orang berkumpul ya. Sepertinya ada kecelakaan.","せきも 出るし、風邪を ひいたようです。= Batuk juga, sepertinya saya masuk angin."]}
]},
{hari:23,bab:48,title:"Bentuk Kausatif (使役)",points:[
 {p:"Cara membentuk kausatif (〜せます/〜させます)",rumus:"G1: bunyi i → a + せます（いきます→いかせます）｜G2: + させます（たべさせます）｜G3: します→させます・きます→こさせます",arti:"menyuruh / membiarkan…",note:"Grup 1: bunyi “i”→“a” + せます (いきます→いかせます). Grup 2: + させます (たべさせます). Khusus: します→させます、きます→こさせます.",ex:["先生は 学生に 作文を 書かせます。= Guru menyuruh murid menulis karangan.","娘を 留学させます。= Saya membiarkan anak saya belajar di luar negeri."]},
 {p:"Partikel: を atau に?",rumus:"Orang を + KK kausatif intransitif｜Orang に + KB を + KK kausatif transitif",arti:"orang を + KK intransitif / orang に + KK transitif",note:"Kalau kata kerjanya tidak punya objek: orang pakai を (息子を 行かせます). Kalau punya objek: orang pakai に (息子に 食べさせます).",ex:["子どもを 公園で 遊ばせます。= Membiarkan anak bermain di taman.","子どもに 野菜を 食べさせます。= Menyuruh anak makan sayur."]},
 {p:"〜させていただけませんか",rumus:"KK kausatif bentuk て + いただけませんか",arti:"bolehkah saya…? (sangat sopan)",note:"Minta izin dengan sangat sopan: “izinkan saya…”.",ex:["すみませんが、早退させて いただけませんか。= Maaf, bolehkah saya pulang lebih awal?","この 電話を 使わせて いただけませんか。= Bolehkah saya memakai telepon ini?"]}
]},
{hari:24,bab:49,title:"Bahasa Hormat 1: 尊敬語 (Meninggikan Lawan)",points:[
 {p:"〜れます/〜られます (sonkeigo ringan)",rumus:"Bentuknya sama dengan pasif: G1 bunyi i → a + れます｜G2 + られます",arti:"bentuk hormat sederhana",note:"Bentuknya sama dengan bentuk pasif. Dipakai untuk perbuatan orang yang kita hormati (atasan, tamu, guru).",ex:["社長は もう 帰られました。= Direktur sudah pulang.","先生は 何時に 来られますか。= Bapak/Ibu guru datang jam berapa?"]},
 {p:"お〜になります",rumus:"お + KK bentuk ます（buang ます）+ に なります",arti:"bentuk hormat yang lebih tinggi",note:"お + bentuk ます (tanpa ます) + になります. Tingkat hormatnya lebih tinggi dari 〜られます.",ex:["社長は もう お帰りに なりました。= Direktur sudah pulang.","この 本を お読みに なりましたか。= Apakah Anda sudah membaca buku ini?"]},
 {p:"Kata kerja hormat khusus",rumus:"Hafalkan: いらっしゃいます・召し上がります・おっしゃいます・なさいます・ご覧になります・ご存じです",arti:"hafalkan yang ini!",note:"います/いきます/きます→いらっしゃいます、食べます/飲みます→召し上がります、言います→おっしゃいます、します→なさいます、見ます→ご覧になります、知っています→ご存じです、くれます→くださいます.",ex:["先生は 事務所に いらっしゃいます。= Bapak/Ibu guru ada di kantor.","どうぞ 召し上がって ください。= Silakan dimakan.","ニュースを ご覧に なりましたか。= Apakah Anda sudah menonton beritanya?"]},
 {p:"お〜ください",rumus:"お + KK bentuk ます（buang ます）+ ください",arti:"silakan… (permintaan hormat)",ex:["ちょっと お待ち ください。= Mohon tunggu sebentar.","こちらに お入り ください。= Silakan masuk lewat sini."]}
]},
{hari:25,bab:50,title:"Bahasa Hormat 2: 謙譲語 (Merendahkan Diri)",points:[
 {p:"お〜します / ご〜します",rumus:"お + KK bentuk ます（buang ます）+ します｜ご + KK serapan（案内・説明など）+ します",arti:"saya (dengan rendah hati) me-…",note:"Merendahkan perbuatan SENDIRI untuk menghormati lawan bicara. お + bentuk ます + します. Kata kerja serapan Tiongkok: ご + します (ご案内します).",ex:["重そうですね。お持ちしましょうか。= Kelihatannya berat. Mari saya bawakan.","事務所を ご案内します。= Saya antar Anda melihat kantor."]},
 {p:"Kata kerja rendah hati khusus",rumus:"Hafalkan: まいります・おります・いただきます・申します・拝見します・いたします・お目にかかります",arti:"hafalkan yang ini!",note:"いきます/きます→まいります、います→おります、食べます/もらいます→いただきます、言います→申します、見ます→拝見します、します→いたします、会います→お目にかかります.",ex:["ミラーと 申します。= Nama saya Miller.","アメリカから まいりました。= Saya datang dari Amerika.","社長の 写真を 拝見しました。= Saya sudah melihat foto direktur."]},
 {p:"〜でございます",rumus:"KB + でございます（= です yang sangat sopan）",arti:"bentuk sangat sopan dari です",note:"Sering dipakai staf toko, hotel, dan pengumuman resmi.",ex:["お手洗いは ２階でございます。= Toilet ada di lantai 2.","こちらは 新しい モデルでございます。= Yang ini model terbaru."]}
]}
];
const KOTOBA = [

<script>

const DONE_KEY = 'n4-done';

/* ===== Akses localStorage aman (tahan JSON rusak / SecurityError / penyimpanan nonaktif) ===== */
function lsGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); return true; } catch (e) { return false; }
}
function lsDel(key) {
  try { localStorage.removeItem(key); } catch (e) { /* abaikan */ }
}
function loadDone() {
  const raw = lsGet(DONE_KEY);
  if (raw == null) return new Set();
  try {
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) throw new Error('format bukan array');
    return new Set(arr.filter(x => Number.isInteger(x)));
  } catch (e) {
    lsDel(DONE_KEY); // data rusak: hapus supaya tidak mengganggu berikutnya
    return new Set();
  }
}
let done = loadDone();
let hafalan = lsGet(HAF_KEY) === '1';
let openSet = new Set();
let kjFlip = new Set();

const bunpouOf = h => BUNPOU.find(b => b.hari === h);
const kotobaOf = h => KOTOBA.find(k => k.hari === h);

const saveDone = () => { lsSet(DONE_KEY, JSON.stringify([...done])); };

const TOTAL_POINTS = BUNPOU.reduce((a, b) => a + b.points.length, 0);
/* ===== Furigana engine (otomatis, hanya kanji di atas level N5) ===== */
const N5SET = new Set(KANJI.map(k => k.kanji));
const FURI = {

"会社員":"かいしゃいん","富士山":"ふじさん","会議室":"かいぎしつ","郵便局":"ゆうびんきょく","喫茶店":"きっさてん","飛行機":"ひこうき","北海道":"ほっかいどう","図書館":"としょかん","交差点":"こうさてん",
"社員":"しゃいん","辞書":"じしょ","食堂":"しょくどう","手洗":"てあら","毎朝":"まいあさ","勉強":"べんきょう","奈良":"なら","銀行":"ぎんこう","昼休":"ひるやす","京都":"きょうと","大阪":"おおさか","家族":"かぞく","一緒":"いっしょ","部屋":"へや","東京":"とうきょう","生活":"せいかつ","果物":"くだもの","音楽":"おんがく","公園":"こうえん","写真":"しゃしん","本屋":"ほんや","手紙":"てがみ","切手":"きって","五枚":"ごまい","二回":"にかい","映画":"えいが","旅行":"りょこう","野球":"やきゅう","沖縄":"おきなわ","神戸":"こうべ","料理":"りょうり","荷物":"にもつ","結婚":"けっこん","独身":"どくしん","仕事":"しごと","漢字":"かんじ","趣味":"しゅみ","食事":"しょくじ","元気":"げんき","医者":"いしゃ","物価":"ぶっか","約束":"やくそく","用事":"ようじ","佐藤":"さとう","住所":"じゅうしょ","山田":"やまだ","洗濯":"せんたく","夏休":"なつやす","手伝":"てつだ","土産":"みやげ","靴売":"くつう","宿題":"しゅくだい","練習":"れんしゅう","都合":"つごう","故障":"こしょう","準備":"じゅんび","億円":"おくえん","転勤":"てんきん","全部":"ぜんぶ","授業":"じゅぎょう","毎晚":"まいばん","一度":"いちど","教室":"きょうしつ","神社":"じんじゃ",

};
const FURI_KEYS = Object.keys(FURI).sort((a,b)=>b.length-a.length);
const FURI_MAX = FURI_KEYS.reduce((m,k)=>Math.max(m,k.length),1);
function rb(s){
  s = String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  return s.replace(/[\u4e00-\u9fff\u3005]+/g, function(run){
    if (![...run].some(c => !N5SET.has(c))) return run; // semua kanji N5 -> tanpa furigana
    let out = '', i = 0;
    while (i < run.length) {
      let matched = false;
      for (let L = Math.min(FURI_MAX, run.length - i); L >= 1; L--) {
        const sub = run.substr(i, L);
        if (FURI[sub]) { out += '<ruby>' + sub + '<rt>' + FURI[sub] + '</rt></ruby>'; i += L; matched = true; break; }
      }
      if (!matched) { out += run[i]; i++; }
    }
    return out;
  });
}
const TOTAL_WORDS = KOTOBA.reduce((a, k) => a + k.words.length, 0);

  if (state.view === 'home') renderHome();

}

    + '<h3>' + esc(b.title) + '</h3>'
    + '<span class="kt b"><span class="tag">Bunpou</span>' + b.points.length + ' pola kalimat</span>'
    + (kt ? '<span class="kt"><span class="tag">Kotoba</span>' + rb(kt.theme) + ' · ' + kt.words.length + ' kata</span>'
          : '<span class="kt"><span class="tag">Kotoba</span>—</span>')
    + '</button>';
}
function matches(b, q) {
  q = (q || '').trim();
  if (!q) return true;
  const kt = kotobaOf(b.hari);
  let hay = 'hari ' + b.hari + ' ' + b.title + ' ' + b.points.map(p => p.p + ' ' + p.arti).join(' ');
  if (kt) hay += ' ' + kt.theme + ' ' + (kt.sub || '') + ' ' + kt.words.map(w => w.w + ' ' + (w.k || '') + ' ' + w.m).join(' ');
  return hay.toLowerCase().includes(q.toLowerCase());
}
function gridHTML() {
  const list = BUNPOU.filter(b => matches(b, state.q));
  if (!list.length) return '<div class="empty">Tidak ada bab yang cocok dengan “' + esc(state.q) + '”.</div>';
  return '<div class="grid">' + list.map(cardHTML).join('') + '</div>';
}

    + '<div class="stat"><b>' + TOTAL_WORDS + '</b><span>kosakata</span></div>'

}

  $app.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
    state.hari = +c.dataset.hari;
    state.view = 'bab';
    state.tab = 'bunpou';
    openSet = new Set([0]);
    render();

}

function bunpouTabHTML(b) {
  return '<div class="toolrow">'
    + '<button class="mini" id="openall">Buka semua</button>'
    + '<button class="mini" id="closeall">Tutup semua</button>'
    + '</div>'
    + b.points.map(gpHTML).join('');
}
function kotobaTabHTML(h) {
  const kt = kotobaOf(h);
  if (!kt) {
    return '<div class="kt-none"><b>Tidak ada kosakata untuk Hari ' + h + '</b>'
      + 'Materi kotoba untuk hari ini belum tersedia — gunakan tab Bunpou di atas.</div>';
  }
  return '<div class="kt-head"><span class="theme">' + rb(kt.theme) + '</span>'
    + '<span class="sub">' + esc(kt.sub || '') + '</span>'
    + '<button class="switch' + (hafalan ? ' on' : '') + '" id="haf" aria-pressed="' + hafalan + '"><span>Mode hafalan</span><span class="dot" aria-hidden="true"></span></button>'
    + '</div>'
    + (hafalan ? '<div class="hint">Arti disembunyikan — ketuk kartu untuk melihat jawabannya.</div>' : '')
    + '<div class="words">' + kt.words.map(wordHTML).join('') + '</div>';
}
function renderBab() {
  const b = bunpouOf(state.hari);
  const isDone = done.has(state.hari);
  const prev = bunpouOf(state.hari - 1);
  const next = bunpouOf(state.hari + 1);
  $app.innerHTML =
    '<div class="topbar">'
    + '<button class="btn" id="back">← Menu utama</button>'
    + '<span class="spacer"></span>'
    + '<button class="btn' + (isDone ? ' done-on' : '') + '" id="toggledone">' + (isDone ? '✓ Selesai dipelajari' : '○ Tandai selesai') + '</button>'
    + '</div>'
    + '<div class="bab-head"><div class="hari">Hari ' + b.hari + ' / ' + BUNPOU.length + ' · Bab ' + b.bab + '</div><h2>' + esc(b.title) + '</h2></div>'
    + '<div class="tabs" role="tablist" aria-label="Materi hari ' + b.hari + '">'
    + '<button class="tab' + (state.tab === 'bunpou' ? ' on' : '') + '" data-tab="bunpou" role="tab" id="tab-bunpou" aria-selected="' + (state.tab === 'bunpou') + '" aria-controls="tabbody"' + (state.tab === 'bunpou' ? '' : ' tabindex="-1"') + '>文法 Bunpou</button>'
    + '<button class="tab' + (state.tab === 'kotoba' ? ' on' : '') + '" data-tab="kotoba" role="tab" id="tab-kotoba" aria-selected="' + (state.tab === 'kotoba') + '" aria-controls="tabbody"' + (state.tab === 'kotoba' ? '' : ' tabindex="-1"') + '>言葉 Kotoba</button>'
    + '</div>'
    + '<div id="tabbody" role="tabpanel" aria-labelledby="tab-' + state.tab + '">' + (state.tab === 'bunpou' ? bunpouTabHTML(b) : kotobaTabHTML(b.hari)) + '</div>'
    + '<div class="pager">'
    + (prev ? '<button class="btn" id="prev">← Hari ' + prev.hari + ' <small>· sebelumnya</small></button>' : '')
    + (next ? '<button class="btn" id="next">Hari ' + next.hari + ' <small>· berikutnya</small> →</button>' : '')
    + '</div>'
    + footerHTML();
  document.getElementById('back').onclick = () => { state.view = 'home'; render(); };
  document.getElementById('toggledone').onclick = () => {
    if (done.has(state.hari)) done.delete(state.hari); else done.add(state.hari);
    saveDone(); renderBab();
  };
  const tabs = Array.from($app.querySelectorAll('.tab'));
  tabs.forEach((t, idx) => {
    t.onclick = () => {
      state.tab = t.dataset.tab;
      if (state.tab === 'bunpou') openSet = new Set([0]);
      renderBab();
      const cur = $app.querySelector('.tab.on');
      if (cur) cur.focus();
    };
    t.onkeydown = e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const next = tabs[(idx + dir + tabs.length) % tabs.length];
      if (next) next.click();
    };
  });
  if (document.getElementById('prev')) document.getElementById('prev').onclick = () => { state.hari--; state.tab = 'bunpou'; openSet = new Set([0]); render(); };
  if (document.getElementById('next')) document.getElementById('next').onclick = () => { state.hari++; state.tab = 'bunpou'; openSet = new Set([0]); render(); };
  bindTabBody();
}
function bindTabBody() {
  $app.querySelectorAll('.gp-head').forEach(hd => hd.onclick = () => {
    const gp = hd.parentElement;
    const i = +gp.dataset.i;
    const nowOpen = !openSet.has(i);
    if (nowOpen) openSet.add(i); else openSet.delete(i);
    gp.classList.toggle('open', nowOpen);
    hd.setAttribute('aria-expanded', String(nowOpen));
  });
  const oa = document.getElementById('openall');
  if (oa) oa.onclick = () => {
    openSet = new Set(bunpouOf(state.hari).points.map((_, i) => i));
    $app.querySelectorAll('.gp').forEach(g => {
      g.classList.add('open');
      const hd = g.querySelector('.gp-head');
      if (hd) hd.setAttribute('aria-expanded', 'true');
    });
  };
  const ca = document.getElementById('closeall');
  if (ca) ca.onclick = () => {
    openSet = new Set();
    $app.querySelectorAll('.gp').forEach(g => {
      g.classList.remove('open');
      const hd = g.querySelector('.gp-head');
      if (hd) hd.setAttribute('aria-expanded', 'false');
    });
  };
  const haf = document.getElementById('haf');
  if (haf) haf.onclick = () => {
    hafalan = !hafalan;
    lsSet(HAF_KEY, hafalan ? '1' : '0');
    renderBab();
  };
  $app.querySelectorAll('.word.veiled').forEach(w => w.onclick = () => w.classList.toggle('shown'));
}

/* ============ KANJI FLASHCARD ============ */
function kjMatches(k, q) {
  q = (q || '').trim();
  if (!q) return true;
  const hay = k.no + ' ' + k.kanji + ' ' + k.baca + ' ' + k.kata.join(' ') + ' ' + (k.jp || '') + ' ' + (k.id || '');
  return hay.toLowerCase().includes(q.toLowerCase());
}
function kjCardHTML(k) {
  const flip = kjFlip.has(k.no) ? ' flip' : '';
  return '<div class="kj-card' + flip + '" data-no="' + k.no + '" role="button" tabindex="0" aria-label="Detail kanji ' + esc(k.kanji) + ' (kartu nomor ' + k.no + ')">'
    + '<div class="kj-inner">'
    + '<div class="kj-face kj-front"><span class="kj-no">#' + k.no + '</span><span class="kj-ch">' + esc(k.kanji) + '</span><span class="kj-tap">ketuk untuk detail</span></div>'
    + '<div class="kj-face kj-back">'
    + '<div class="kj-ch2">' + esc(k.kanji) + '<span class="kj-baca">' + esc(k.baca) + '</span></div>'
    + '<ul class="kj-kata">' + k.kata.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    + (k.jp ? '<div class="kj-kalimat"><span class="jp">' + rb(k.jp) + '</span>' + esc(k.id) + '</div>' : '')
    + '</div></div></div>';
}
function kjGridHTML() {
  const list = KANJI.filter(k => kjMatches(k, state.kjQ));
  if (!list.length) return '<div class="empty">Tidak ada kanji yang cocok dengan “' + esc(state.kjQ) + '”.</div>';
  return '<div class="kj-grid">' + list.map(kjCardHTML).join('') + '</div>';
}
function bindKjCards() {
  $app.querySelectorAll('.kj-card').forEach(c => {
    c.onclick = () => openKjModal(+c.dataset.no, c);
    c.onkeydown = e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      openKjModal(+c.dataset.no, c);
    };
  });
}

/* ---- pop up detail kanji ---- */
function kjJuList(k) {
  const ex = KJEX[k.kanji] || {};
  const ju = (ex.ju || []).slice();
  const have = new Set(ju.map(s => s.split('（')[0].trim()));
  (k.kata || []).forEach(s => {
    const w = s.split('（')[0].split(' (')[0].trim();
    if (!have.has(w)) { have.add(w); ju.push(s); }
  });
  return ju;
}
function kjJuItemHTML(s) {
  const i = s.indexOf('=');
  const head = i >= 0 ? s.slice(0, i).trim() : s;
  const m = i >= 0 ? s.slice(i + 1).trim() : '';
  return '<li><span class="wr">' + esc(head) + '</span>' + (m ? '<span class="m">= ' + esc(m) + '</span>' : '') + '</li>';
}
let kjTrigger = null;
function kjFocusables(wrap) {
  return Array.from(wrap.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.getClientRects().length > 0);
}
function closeKjModal(silent) {
  const el = document.getElementById('kjmodal');
  if (!el) return;
  el.remove();
  document.body.style.overflow = '';
  $app.removeAttribute('inert');
  if (!silent && kjTrigger && document.contains(kjTrigger)) kjTrigger.focus();
  kjTrigger = null;
}
function openKjModal(no, trigger) {
  closeKjModal(true);
  const k = KANJI.find(x => x.no === no);
  if (!k) return;
  kjTrigger = trigger || (document.activeElement && document.activeElement !== document.body ? document.activeElement : null);
  const ex = KJEX[k.kanji] || {};
  const wrap = document.createElement('div');
  wrap.className = 'kj-modal';
  wrap.id = 'kjmodal';
  wrap.innerHTML = '<div class="kj-backdrop"></div>'
    + '<div class="kj-dialog" role="dialog" aria-modal="true" aria-labelledby="kjm-kanji kjm-title">'
    + '<button class="kj-close" aria-label="Tutup">✕</button>'
    + '<div class="kj-dialog-body">'
    + '<div class="kjm-head"><span class="kjm-ch" id="kjm-kanji">' + esc(k.kanji) + '</span>'
    + '<div class="kjm-headinfo"><span class="kjm-no" id="kjm-title">#' + k.no + ' · Kanji N4</span>'
    + '<span class="kjm-baca">' + esc(k.baca) + '</span></div></div>'
    + '<div class="kjm-yomi">'
    + '<div class="kjm-yomibox on"><span class="lbl">音読み · Onyomi</span><span class="val">' + esc(ex.on || '—') + '</span></div>'
    + '<div class="kjm-yomibox kun"><span class="lbl">訓読み · Kunyomi</span><span class="val">' + esc(ex.kun || '—') + '</span></div>'
    + '</div>'
    + '<div class="kjm-sec">熟語 · Jukugo penting yang sering keluar</div>'
    + '<ul class="kjm-ju">' + kjJuList(k).map(kjJuItemHTML).join('') + '</ul>'
    + (k.jp ? '<div class="kjm-sec">例文 · Contoh kalimat</div><div class="kjm-ex"><span class="jp">' + rb(k.jp) + '</span><span class="id">' + esc(k.id) + '</span></div>' : '')
    + '</div></div>';
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  $app.setAttribute('inert', '');
  wrap.querySelector('.kj-backdrop').onclick = () => closeKjModal();
  const kjCloseBtn = wrap.querySelector('.kj-close');
  kjCloseBtn.onclick = () => closeKjModal();
  wrap.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = kjFocusables(wrap);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  kjCloseBtn.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeKjModal(); });
function renderKanji() {
  $app.innerHTML =
    '<div class="topbar">'
    + '<button class="btn" id="back">← Menu utama</button>'
    + '<span class="spacer"></span>'
    + '<button class="mini" id="kjopenall">Buka semua</button>'
    + '<button class="mini" id="kjcloseall">Tutup semua</button>'
    + '</div>'
    + '<div class="bab-head"><div class="hari">Kanji N4</div><h2>🈂️ Flashcard Kanji (' + KANJI.length + ')</h2></div>'
    + '<div class="kj-hint">Diambil dari PDF Kanji Flashcard N4 &middot; ketuk kartu untuk membuka pop up detail: onyomi, kunyomi, jukugo penting, dan contoh kalimat.</div>'
    + '<div class="searchbar">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
    + '<input id="kjq" type="text" placeholder="Cari kanji, cara baca, atau arti…" value="' + esc(state.kjQ) + '" aria-label="Cari kanji, cara baca, atau arti">'
    + '</div>'
    + '<div id="kjgridwrap">' + kjGridHTML() + '</div>'
    + footerHTML();
  document.getElementById('back').onclick = () => { state.view = 'home'; render(); };
  const kq = document.getElementById('kjq');
  kq.addEventListener('input', () => {
    state.kjQ = kq.value;
    document.getElementById('kjgridwrap').innerHTML = kjGridHTML();
    bindKjCards();
  });
  document.getElementById('kjopenall').onclick = () => {
    KANJI.filter(k => kjMatches(k, state.kjQ)).forEach(k => kjFlip.add(k.no));
    document.getElementById('kjgridwrap').innerHTML = kjGridHTML();
    bindKjCards();
  };
  document.getElementById('kjcloseall').onclick = () => {
    kjFlip.clear();
    document.getElementById('kjgridwrap').innerHTML = kjGridHTML();
    bindKjCards();
  };
  bindKjCards();
}
render();
</script>
</body>
</html>
